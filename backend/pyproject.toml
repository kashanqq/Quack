[project]
name = "quack-api"
version = "0.1.0"
description = "Quack backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "asyncpg",
    "alembic",
    "neo4j>=5",
    "redis",
    "arq",
    "openai",
    "httpx",
    "pyjwt",
    "passlib[bcrypt]",
    "bcrypt<4.1",
    "email-validator",
    "structlog",
    "sympy",
    "sentence-transformers",
    "tavily-python",
    "ddgs",
    "selectolax>=0.4.11",
    # Календарь активности считается в Asia/Almaty (§9.3); на Windows и в
    # slim-образах системной базы поясов нет.
    "tzdata",
]

[dependency-groups]
dev = [
    "fakeredis",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring external services",
    "phase1: tests for the first implementation phase",
    "phase2: tests for the second implementation phase",
    "phase3: tests for the third implementation phase (agents)",
    "phase4: tests for the fourth implementation phase (background and Quack)",
    "phase5: tests for the fifth implementation phase (resilience, demo, deploy)",
]
