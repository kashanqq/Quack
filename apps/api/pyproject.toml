[project]
name = "quack-api"
version = "0.1.0"
description = "Quack backend API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "asyncpg",
    "alembic",
    "neo4j>=5",
    "redis",
    "arq",
    "openai",
    "httpx",
    "pyjwt",
    "passlib[bcrypt]",
    "structlog",
    "sympy",
    "sentence-transformers",
    "tavily-python",
    "ddgs",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring external services",
    "phase1: tests for the first implementation phase",
]
